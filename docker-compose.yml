# Local/self-hosted stack: Postgres + migrations + web + worker.
# Copy .env.example to .env and set BEACON_ENCRYPTION_KEY / BEACON_HASH_SECRET first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://beacon:beacon@db:5432/beacon" }
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://beacon:beacon@db:5432/beacon" }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: ["pnpm", "worker"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://beacon:beacon@db:5432/beacon" }
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata:
